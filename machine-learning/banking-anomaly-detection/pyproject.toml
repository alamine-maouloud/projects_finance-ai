[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txanomaly"
version = "1.0.0"
description = "Card and payment fraud detection benchmark: realistic synthetic transactions, causal behavioural features, rules vs Isolation Forest vs gradient boosting, evaluated like a fraud team"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4"]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=8"]

[project.scripts]
txanomaly = "txanomaly.cli:main"

[tool.setuptools.packages.find]
include = ["txanomaly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
