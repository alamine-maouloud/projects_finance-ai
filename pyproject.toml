[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrisk"
version = "0.1.0"
description = "Monte Carlo risk engine: portfolio credit risk, market risk (FRTB ES), counterparty exposure and XVA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcrisk = "mcrisk.cli:main"

[tool.setuptools.packages.find]
include = ["mcrisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical tests"]
