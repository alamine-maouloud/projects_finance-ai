[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immorisk"
version = "1.0.0"
description = "Buy-to-let risk and return in every French commune: DVF sales, rent map, small area estimation, French taxation and a calibrated Monte Carlo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "matplotlib>=3.8", "shapely>=2.0"]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=8"]

[project.scripts]
immorisk = "immorisk.cli:main"

[tool.setuptools.packages.find]
include = ["immorisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
